# Optional. Local development database:   docker compose up -d mongo
#           Whole API in a container:     docker compose --profile api up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["api"]
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/iqtest
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  mongo-data:
